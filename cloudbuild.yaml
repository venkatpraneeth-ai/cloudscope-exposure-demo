steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloudscope/quickbite:$BUILD_ID'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloudscope/quickbite:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
